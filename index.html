<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة الطلاب - المهمة الثانية</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎓 نظام إدارة وتقييم الطلاب</h1>
            <p>مشروع التكليف الثاني - العرض المباشر للنتائج ولجنة الرأفة</p>
        </header>

        <section class="card">
            <h2>📋 تقرير أداء الطلاب بالكامل</h2>
            <div id="students-list"></div>
        </section>

        <section class="card">
            <h2>⚖️ لجنة الرأفة (إضافة +5 درجات للمتعثرين)</h2>
            <div id="grace-list"></div>
            <div id="grace-summary" class="summary-box"></div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
